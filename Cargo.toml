[workspace]
resolver = "2"
members = [
    "crates/victor-domain",
    "crates/victor-policy",
    "crates/victor-integrations",
    "crates/victor-context",
    "crates/victor-tools",
    "crates/victor-fetch-bald",
    "crates/victor-storage",
    "crates/victor-skills",
    "crates/victor-skill-forge",
    "crates/victor-skill-api",
    "crates/victor-skill-transport",
    "crates/victor-skill-cli",
    "crates/victor-stt-cloud",
    "crates/victor-runtime",
    "crates/victor-plugin-contract",
    "crates/victor-plugin-host",
    "crates/victor-daemon",
    "crates/victor-conversation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
url = "2"
