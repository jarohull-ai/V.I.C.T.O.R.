[package]
name = "victor-stt-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
openai = ["dep:reqwest", "dep:futures-util"]
deepgram = ["dep:reqwest", "dep:futures-util"]

[dependencies]
victor-domain = { path = "../victor-domain" }
victor-integrations = { path = "../victor-integrations" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["time"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio.workspace = true
